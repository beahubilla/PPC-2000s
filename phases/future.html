<!-- ============================================================
     PHASE 3: FUTURE (2030s+) — HERO BANNER & NEUROLINK AR VISOR RELIC
     ============================================================ -->

<template id="future-hero-template">
      <figure class="hero-spotlight hero-spotlight-future only-future">
        <img src="./images/future-wing-hero.jpg" alt="A futuristic 2030s museum hall with glowing holographic projections of Manila and AI interfaces" fetchpriority="high">
        <div class="hero-image-shade" aria-hidden="true"></div>
        <figcaption>
          <span class="hero-overline">FUTURE WING &nbsp; / &nbsp; 2030 HORIZON</span>
          <h2 class="hero-title">Where heritage meets<br><em>holographic light.</em></h2>
          <p>8G AI-assisted communication, digital banking, AI fact-checking, virtual concerts, and satellite weather forecasting.</p>
          <div class="hero-actions">
            <button type="button" onclick="openRoom(0)" class="btn btn-pink">Enter 2030 archive <span aria-hidden="true">↗</span></button>
            <a href="#exhibits" class="btn">Browse exhibits <span aria-hidden="true">↓</span></a>
            <button type="button" onclick="openMap()" class="btn">🗺️ Floor map</button>
          </div>
        </figcaption>
        <span class="hero-index" aria-hidden="true">2030s+ &nbsp;•&nbsp; HOLO-ARCHIVE 01—06</span>
      </figure>
</template>

<template id="future-relic-template">
      <!-- Future Mode Switcher -->
      <div class="future-mode-switch only-future" role="group" aria-label="Choose AR visor module">
        <button type="button" id="future-mode-holo-btn" class="future-mode-btn active" aria-pressed="true" onclick="setFutureMode('holo')">🫧 8G Holo-Link</button>
        <button type="button" id="future-mode-game-btn" class="future-mode-btn" aria-pressed="false" onclick="setFutureMode('game')">⚡ Quantum Sync</button>
      </div>

      <!-- DEVICE 3: 2035 NeuroLink AR Visor (Future / 2030s+) -->
      <div class="holovisor-device only-future">
        <div class="holovisor-frame">
          <div class="holovisor-bridge" aria-hidden="true"></div>
          <div class="holovisor-hud">
            <div class="holovisor-status">
              <span>MNL-2030 · 21:40 PST</span>
              <span class="holovisor-signal" id="future-hud-signal">8G AI-NET · SYNC 99% ◈</span>
            </div>

            <!-- VIEW 1: HOLO-LINK SPATIAL CHAT -->
            <div id="future-holo-view" class="holovisor-app-view is-active">
              <div class="future-chat-header">
                <span class="future-avatar" aria-hidden="true">🌌</span>
                <div>
                  <strong>Barkada 8G Hub</strong>
                  <span>Tap any transmission to neural-sync ⚡ · AI Assistant ON</span>
                </div>
                <span class="future-live-pill">8G LIVE</span>
              </div>
              <div class="future-chat-feed" id="future-holo-feed" aria-live="polite" aria-label="Holographic transmissions">
                <div class="future-chat-date">2030 AI NETWORK LOG</div>
                <div class="future-msg future-msg-in" onclick="toggleFutureReaction(this)">
                  <span class="future-msg-meta">Bea · [8G Smart Hub · Marikina]</span>
                  Uy! Naka-connect na OFW family virtual call natin habang nanonood ng interactive virtual P-Pop concert!
                </div>
                <div class="future-msg future-msg-in" onclick="toggleFutureReaction(this)">
                  <span class="future-msg-meta">Benz · [Global Sports Virtual Hub]</span>
                  G! Live na yung international tournament ng Filipino athletes sa virtual viewing community natin.
                </div>
                <div class="future-msg future-msg-ai" onclick="toggleFutureReaction(this)">
                  <span class="future-msg-meta">TALA-2030 · [AI Weather &amp; Civic Co-Pilot]</span>
                  AI Satellite Weather Advisory: Clear skies across Metro Manila. AI fact-checking &amp; digital public services active.
                </div>
                <div class="future-msg future-msg-out" onclick="toggleFutureReaction(this)">
                  Joining the 8G virtual stream now! Save a slot for me 🌌
                </div>
                <span class="future-typing" id="future-typing-indicator"><i></i><i></i><i></i> 8G AI Assistant ready · Transmit a prompt</span>
              </div>
              <form class="future-composer" onsubmit="futureSendMessage(event)">
                <label class="sr-only" for="future-message-input">Transmit holographic message</label>
                <input id="future-message-input" type="text" maxlength="220" autocomplete="off" placeholder="Ask AI or message the 8G hub…">
                <button type="submit" aria-label="Transmit message" title="Transmit message">⚡</button>
              </form>
            </div>

            <!-- VIEW 2: QUANTUM SYNC NEURAL MINI-GAME -->
            <div id="future-game-view" class="holovisor-app-view future-game-view" hidden>
              <div class="future-game-header">
                <span>NEURAL REFLEX LAB</span>
                <span>QUANTUM SYNC v3.5</span>
              </div>
              <div class="future-game-scorebar">
                <span>SCORE <strong id="future-game-score">000</strong></span>
                <span>COMBO <strong id="future-game-combo">x1</strong></span>
                <span>TIME <strong id="future-game-time">20</strong>s</span>
              </div>
              <div class="future-game-arena" id="future-game-arena">
                <div class="future-grid-lines" aria-hidden="true"></div>
                <button type="button" id="future-game-target" class="future-game-target" aria-label="Stabilize quantum node" onclick="futureGameTap('normal')" hidden>
                  <span class="node-ring"></span>
                  <span class="node-core">◈</span>
                </button>
                <button type="button" id="future-game-bonus" class="future-game-bonus" aria-label="Capture golden overclock node" onclick="futureGameTap('bonus')" hidden>
                  <span class="node-core">★</span>
                </button>
                <div id="future-game-overlay" class="future-game-overlay">
                  <span class="future-game-emblem" aria-hidden="true">◈</span>
                  <strong id="future-game-message">Quantum Sync</strong>
                  <p id="future-game-instructions">Stabilize glowing quantum nodes before phase decay. Chain rapid hits to multiply your neural sync score!</p>
                  <button type="button" id="future-game-start" onclick="startFutureGame()">Initialize 20s Run ⚡</button>
                </div>
              </div>
              <div class="future-game-foot">
                <span>Tap cyan nodes (+10×combo) &amp; gold cores (+35)</span>
                <span>BEST <strong id="future-game-best">0</strong></span>
              </div>
            </div>

            <div class="holovisor-home-bar" aria-hidden="true"></div>
          </div>
        </div>
      </div>

      <!-- Future AR Visor Shortcuts -->
      <div class="future-shortcuts mt-5 max-w-md mx-auto only-future">
        <span class="future-shortcuts-label">Transmit a 2030 preset (triggers smart AI &amp; barkada reply)</span>
        <div class="future-preset-list">
          <button type="button" onclick="futureUsePreset('Connecting our OFW family call on 8G with AI live translation! 🌐')">🌐 8G OFW Family Call</button>
          <button type="button" onclick="futureUsePreset('Joining the interactive virtual P-Pop concert &amp; creator livestream! 🎶')">🎶 Virtual Concert</button>
          <button type="button" onclick="futureUsePreset('Watching our Filipino athletes live in the international league virtual hub! 🏆')">🏆 Global Sports Hub</button>
          <button type="button" onclick="futureUsePreset('Run AI weather forecast, satellite storm tracker &amp; AI fact-check! 🛰️')">🛰️ AI Weather &amp; Civic Check</button>
        </div>
      </div>
</template>
