<!-- ============================================================
     PHASE 2: PRESENT (TODAY / 2020s) — HERO BANNER & 5G SMARTPHONE RELIC
     ============================================================ -->

<template id="present-hero-template">
      <figure class="hero-spotlight only-now">
        <img src="./images/today-wing-hero.png" alt="An iridescent Y2K museum display featuring a chrome flip phone, smartphone, compact discs, and holographic interfaces" fetchpriority="high">
        <div class="hero-image-shade" aria-hidden="true"></div>
        <figcaption>
          <span class="hero-overline">TODAY WING &nbsp; / &nbsp; PHILIPPINE POP CULTURE, REBOOTED</span>
          <h2 class="hero-title">The present looks<br><em>a little familiar.</em></h2>
          <p>Everything in one smartphone: 5G social feeds, e-wallets, global P-pop, and multi-sport livestreams.</p>
          <div class="hero-actions">
            <button type="button" onclick="openRoom(0)" class="btn btn-pink">Explore the collection <span aria-hidden="true">↗</span></button>
            <a href="#exhibits" class="btn">Browse exhibits <span aria-hidden="true">↓</span></a>
          </div>
        </figcaption>
        <span class="hero-index" aria-hidden="true">01 &nbsp;—&nbsp; 06</span>
      </figure>
</template>

<template id="present-relic-template">
      <!-- Today Mode Switcher -->
      <div class="modern-mode-switch only-now" role="group" aria-label="Choose smartphone app">
        <button type="button" id="modern-mode-chat-btn" class="modern-mode-btn active" aria-pressed="true" onclick="setModernMode('chat')">💬 Besties GC</button>
        <button type="button" id="modern-mode-game-btn" class="modern-mode-btn" aria-pressed="false" onclick="setModernMode('game')">✨ Glow Rush</button>
      </div>

      <!-- DEVICE 2: Modern 5G Smartphone (Today / 2020s) -->
      <div class="smartphone-device only-now">
        <div class="smartphone-screen">
          <div class="smartphone-status"><span>9:41</span><span aria-label="Full signal, Wi-Fi, battery">5G &nbsp; ▰</span></div>
          <div id="modern-chat-view" class="smartphone-app-view">
            <div class="modern-chat-header">
              <span class="modern-contact-avatar" aria-hidden="true">B</span>
              <div><strong>Besties GC</strong><span>Tap any message to react ❤️ · active now</span></div>
              <span class="modern-chat-call" aria-hidden="true">•••</span>
            </div>
            <div class="modern-chat-feed" id="modern-chat-feed" aria-live="polite" aria-label="Messages">
              <div class="modern-chat-date">TODAY · 9:38 AM</div>
              <div class="modern-message modern-message-in" onclick="toggleModernReaction(this)"><span class="modern-message-name">Bea</span>Uy, nasa exhibit na kami! Ang ganda ng Today wing.</div>
              <div class="modern-message modern-message-in" onclick="toggleModernReaction(this)"><span class="modern-message-name">Benz</span>Game tayo after? PVL &amp; B.League livestream mamaya!</div>
              <div class="modern-message modern-message-out" onclick="toggleModernReaction(this)">On my way! Save me a spot ✨</div>
              <span class="modern-typing" id="modern-typing-indicator"><i></i><i></i><i></i> Active in GC</span>
            </div>
            <form class="modern-composer" onsubmit="modernSendMessage(event)">
              <label class="sr-only" for="modern-message-input">Write a message</label>
              <input id="modern-message-input" type="text" maxlength="220" autocomplete="off" placeholder="Message Besties GC (gets a reply)…">
              <button type="submit" aria-label="Send message" title="Send message">↑</button>
            </form>
          </div>
          <div id="modern-game-view" class="smartphone-app-view modern-game-view" hidden>
            <div class="modern-game-header"><span>MINI ARCADE</span><span>GLOW RUSH</span></div>
            <div class="modern-game-scorebar">
              <span>SCORE <strong id="modern-game-score">00</strong></span>
              <span>STREAK <strong id="modern-game-combo">x1</strong></span>
              <span>TIME <strong id="modern-game-time">15</strong>s</span>
            </div>
            <div class="modern-game-arena" id="modern-game-arena">
              <button type="button" id="modern-game-target" class="modern-game-target" aria-label="Tap the glowing target" onclick="modernGameTap('normal')" hidden><span></span></button>
              <button type="button" id="modern-game-bonus" class="modern-game-bonus" aria-label="Tap bonus star" onclick="modernGameTap('bonus')" hidden>★</button>
              <div id="modern-game-overlay" class="modern-game-overlay">
                <span class="modern-game-sparkle" aria-hidden="true"></span>
                <strong id="modern-game-message">Glow Rush</strong>
                <p id="modern-game-instructions">Chain fast taps for combo multipliers &amp; catch gold stars (+3)!</p>
                <button type="button" id="modern-game-start" onclick="startModernGame()">Play 15 seconds</button>
              </div>
            </div>
            <div class="modern-game-foot"><span>Tap orbs (+1×streak) &amp; ★ (+3)</span><span>BEST <strong id="modern-game-best">0</strong></span></div>
          </div>
          <div class="smartphone-home-indicator" aria-hidden="true"></div>
        </div>
      </div>

      <!-- Today Smartphone Shortcuts -->
      <div class="modern-shortcuts mt-5 max-w-md mx-auto only-now">
        <span class="modern-shortcuts-label">Send a quick GC message (triggers live barkada reply)</span>
        <div class="modern-preset-list">
          <button type="button" onclick="modernUsePreset('Nasa museum na kami — ikaw, where you at?')">Where you at?</button>
          <button type="button" onclick="modernUsePreset('Grabe yung 2026 bebot makeup look at P-Pop sa TikTok! 💄')">Bebot &amp; P-Pop</button>
          <button type="button" onclick="modernUsePreset('Sent na sa GCash! Nood tayo ng PVL livestream mamaya 🏐')">GCash &amp; PVL</button>
        </div>
      </div>
</template>
