<!-- ============================================================
     PHASE 3: FUTURE (2030s+) — HERO BANNER & NEUROLINK AR VISOR RELIC
     ============================================================ -->

<template id="future-hero-template">
      <figure class="hero-spotlight hero-spotlight-future only-future">
        <img src="./images/future-wing-hero.jpg" alt="A futuristic 2030s museum hall with glowing holographic projections of Manila and AI interfaces" loading="lazy" decoding="async">
        <div class="hero-image-shade" aria-hidden="true"></div>
        <figcaption>
          <span class="hero-overline">FUTURE WING &nbsp; / &nbsp; 2030 HORIZON</span>
          <h2 class="hero-title">Where heritage meets<br><em>holographic light.</em></h2>
          <p>6G AI-assisted communication, digital banking, AI fact-checking, virtual concerts, and satellite weather forecasting.</p>
          <div class="hero-actions">
            <button type="button" onclick="openRoom(0)" class="btn btn-pink">Enter 2030 archive <span aria-hidden="true">↗</span></button>
            <a href="#exhibits" class="btn">Browse exhibits <span aria-hidden="true">↓</span></a>
            <button type="button" onclick="openMap()" class="btn">🗺️ Floor map</button>
          </div>
        </figcaption>
        <span class="hero-index" aria-hidden="true">2030s+ &nbsp;•&nbsp; HOLO-ARCHIVE 01—06</span>
      </figure>
</template>

<template id="future-relic-template">
      <!-- Future Mode Switcher -->
      <div class="future-mode-switch only-future" role="group" aria-label="Choose AR visor module">
        <button type="button" id="future-mode-holo-btn" class="future-mode-btn active" aria-pressed="true" onclick="setFutureMode('holo')">🫧 6G Holo-Link</button>
        <button type="button" id="future-mode-game-btn" class="future-mode-btn" aria-pressed="false" onclick="setFutureMode('game')">⚔️ Holo-Saber</button>
      </div>

      <!-- DEVICE 3: 2035 NeuroLink AR Visor (Future / 2030s+) -->
      <div class="holovisor-device only-future">
        <div class="holovisor-frame">
          <div class="holovisor-bridge" aria-hidden="true"></div>
          <div class="holovisor-hud">
            <div class="holovisor-status">
              <span>MNL-2030 · 21:40 PST</span>
              <span class="holovisor-signal" id="future-hud-signal">6G AI-NET · SYNC 99% ◈</span>
            </div>

            <!-- VIEW 1: HOLO-LINK SPATIAL CHAT -->
            <div id="future-holo-view" class="holovisor-app-view is-active">
              <div class="future-chat-header">
                <span class="future-avatar" aria-hidden="true">🌌</span>
                <div>
                  <strong>Barkada 6G Hub</strong>
                  <span>Tap any transmission to neural-sync ⚡ · AI Assistant ON</span>
                </div>
                <span class="future-live-pill">6G LIVE</span>
              </div>
              <div class="future-chat-feed" id="future-holo-feed" aria-live="polite" aria-label="Holographic transmissions">
                <div class="future-chat-date">2030 AI NETWORK LOG</div>
                <div class="future-msg future-msg-in" onclick="toggleFutureReaction(this)">
                  <span class="future-msg-meta">Bea · [6G Smart Hub · Marikina]</span>
                  Uy! Naka-connect na OFW family virtual call natin habang nanonood ng interactive virtual P-Pop concert!
                </div>
                <div class="future-msg future-msg-in" onclick="toggleFutureReaction(this)">
                  <span class="future-msg-meta">Benz · [Global Sports Virtual Hub]</span>
                  G! Try niyo rin yung bagong Holo-Saber rhythm beat stage sa AR visor!
                </div>
                <div class="future-msg future-msg-ai" onclick="toggleFutureReaction(this)">
                  <span class="future-msg-meta">TALA-2030 · [AI Weather &amp; Civic Co-Pilot]</span>
                  AI Satellite Weather Advisory: Clear skies across Metro Manila. AI fact-checking &amp; digital public services active.
                </div>
                <div class="future-msg future-msg-out" onclick="toggleFutureReaction(this)">
                  Joining the 6G virtual stream now! Save a slot for me 🌌
                </div>
                <span class="future-typing" id="future-typing-indicator"><i></i><i></i><i></i> 6G AI Assistant ready · Transmit a prompt</span>
              </div>
              <form class="future-composer" onsubmit="futureSendMessage(event)">
                <label class="sr-only" for="future-message-input">Transmit holographic message</label>
                <input id="future-message-input" type="text" maxlength="220" autocomplete="off" placeholder="Ask AI or message the 6G hub…">
                <button type="submit" aria-label="Transmit message" title="Transmit message">⚡</button>
              </form>
            </div>

            <!-- VIEW 2: HOLO-SABER FUTURISTIC RHYTHM SLASHER -->
            <div id="future-game-view" class="holovisor-app-view future-game-view" hidden>
              <div class="future-game-header">
                <span>NEURAL RHYTHM ARENA</span>
                <span>HOLO-SABER 2030</span>
              </div>
              <div class="future-game-scorebar">
                <span>SCORE <strong id="future-game-score">000</strong></span>
                <span>COMBO <strong id="future-game-combo">x1</strong></span>
                <span>TIME <strong id="future-game-time">30</strong>s</span>
              </div>
              <div class="future-game-arena" id="future-game-arena">
                <canvas id="future-saber-canvas" width="340" height="360" style="position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;"></canvas>
                <!-- On-screen Beat Saber Lane Slasher Controls -->
                <div id="future-saber-controls" style="position:absolute;left:0;right:0;bottom:0.5rem;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);gap:0.45rem;padding:0 0.65rem;pointer-events:none;">
                  <button type="button" onpointerdown="futureSaberSlash(0)" aria-label="Slash Left Cyan Lane" style="pointer-events:auto;height:2.4rem;border-radius:0.75rem;border:1.5px solid #00f2fe;background:rgba(0,242,254,0.18);color:#e0faff;font-weight:800;font-size:0.68rem;letter-spacing:0.05em;box-shadow:0 0 14px rgba(0,242,254,0.35);backdrop-filter:blur(4px);cursor:pointer;">⚔️ LEFT (A/◀)</button>
                  <button type="button" onpointerdown="futureSaberSlash(1)" aria-label="Slash Center Violet Lane" style="pointer-events:auto;height:2.4rem;border-radius:0.75rem;border:1.5px solid #c084fc;background:rgba(192,132,252,0.2);color:#f3e8ff;font-weight:800;font-size:0.68rem;letter-spacing:0.05em;box-shadow:0 0 14px rgba(192,132,252,0.35);backdrop-filter:blur(4px);cursor:pointer;">⚔️ MID (S/▲)</button>
                  <button type="button" onpointerdown="futureSaberSlash(2)" aria-label="Slash Right Magenta Lane" style="pointer-events:auto;height:2.4rem;border-radius:0.75rem;border:1.5px solid #f472b6;background:rgba(244,114,182,0.2);color:#fce7f3;font-weight:800;font-size:0.68rem;letter-spacing:0.05em;box-shadow:0 0 14px rgba(244,114,182,0.35);backdrop-filter:blur(4px);cursor:pointer;">⚔️ RIGHT (D/▶)</button>
                </div>
                <div id="future-game-overlay" class="future-game-overlay">
                  <span class="future-game-emblem" aria-hidden="true">⚔️</span>
                  <strong id="future-game-message">Holo-Saber: 2030 Beat</strong>
                  <p id="future-game-instructions">Slice glowing neon beat-cubes as they cross the saber rings! Tap/swipe the 3 lanes or press ◀ ▲ ▶ (A / S / D) in rhythm to build your x8 Overdrive combo.</p>
                  <button type="button" id="future-game-start" onclick="startFutureGame()">Start 30s Rhythm Track ⚡</button>
                </div>
              </div>
              <div class="future-game-foot">
                <span>Slice on the ring: PERFECT (+20×combo) · ★ (+50)</span>
                <span>BEST 🏆 <strong id="future-game-best">0</strong></span>
              </div>
            </div>

            <div class="holovisor-home-bar" aria-hidden="true"></div>
          </div>
        </div>
      </div>

      <!-- Future AR Visor Shortcuts -->
      <div class="future-shortcuts mt-5 max-w-md mx-auto only-future">
        <span class="future-shortcuts-label">Transmit a 2030 preset (triggers smart AI &amp; barkada reply)</span>
        <div class="future-preset-list">
          <button type="button" onclick="futureUsePreset('Connecting our OFW family call on 6G with AI live translation! 🌐')">🌐 6G OFW Family Call</button>
          <button type="button" onclick="futureUsePreset('Joining the interactive virtual P-Pop concert &amp; creator livestream! 🎶')">🎶 Virtual Concert</button>
          <button type="button" onclick="futureUsePreset('Watching our Filipino athletes live in the international league virtual hub! 🏆')">🏆 Global Sports Hub</button>
          <button type="button" onclick="futureUsePreset('Run AI weather forecast, satellite storm tracker &amp; AI fact-check! 🛰️')">🛰️ AI Weather &amp; Civic Check</button>
        </div>
      </div>
</template>
